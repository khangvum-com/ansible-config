---
# Portainer
portainer_parent_dir: "/home/{{ ansible_user }}/docker/portainer"

portainer_access_token: {{ PORTAINER_ACCESS_TOKEN }}

portainer_environments:
  - name: KVM-MGMT01
    id: 3
  - name: KVM-MEDIA01
    id: 4
  - name: KVM-MONITOR01
    id: 5
  - name: KVM-NAS01
    id: 6
  - name: KVM-SECURITY01
    id: 7
  - name: KVM-VPN01
    id: 8
  - name: KVM-IAM01
    id: 10

# Homepage
homepage_parent_dir: "/home/{{ ansible_user }}/docker/homepage"
homepage_config_files:
  - bookmarks.yaml
  - services.yaml
  - settings.yaml
  - widgets.yaml

# Home Assistant
home_assistant_parent_dir: "/home/{{ ansible_user }}/docker/home_assistant"
home_assistant_long_lived_access_token: {{ HOME_ASSISTANT_LONG_LIVED_ACCESS_TOKEN }}

# Cloudflared
cloudflared_parent_dir: "/home/{{ ansible_user }}/docker/cloudflared"
cloudflare_tunnel_token: {{ CLOUDFLARE_TUNNEL_TOKEN }}

# AdGuard Home
adguardhome_parent_dir: "/home/{{ ansible_user }}/docker/adguardhome"