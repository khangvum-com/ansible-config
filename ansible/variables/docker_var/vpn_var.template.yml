---
# Tailscale
tailscale_parent_dir: "/home/{{ ansible_user }}/docker/tailscale"
tailnet_id: {{ TAILNET_ID }}

tailscale_authentication_key: {{ TAILSCALE_AUTHENTICATION_KEY }}  # Must update every 90 days, Reuseable ON
tailscale_advertised_routes: {{ TAILSCALE_ADVERTISED_ROUTES }}

tailscale_oauth_id: {{ TAILSCALE_OAUTH_ID }}
tailscale_oauth_secret: {{ TAILSCALE_OAUTH_SECRET }}

tailscale_api_key: {{ TAILSCALE_API_KEY }}  # Must update every 90 days

tailscale_devices:
  - name: kvm-pc01
    id: {{ TAILSCALE_KVM-PC01_ID }}
  - name: kvm-vpn01
    id: {{ TAILSCALE_KVM-VPN01_ID }}
  - name: iphone-15-pro
    id: {{ TAILSCALE_IPHONE-15-PRO_ID }}
  - name: ipad-pro-11-gen-3
    id: {{ TAILSCALE_IPAD-PRO-11-GEN-3_ID }}

# Nginx Proxy Manager (NPM)
npm_parent_dir: "/home/{{ ansible_user }}/docker/npm"

docker_services:
  - name: authentik
    forward_host: "{{ hostvars['KVM-IAM01'].ansible_host }}"
    forward_port: 9000
  - name: nextcloud
    forward_host: "{{ hostvars['KVM-NAS01'].ansible_host }}"
    forward_port: 8080
  - name: grafana
    forward_host: "{{ hostvars['KVM-MONITOR01'].ansible_host }}"
    forward_port: 3000
  - name: prometheus
    forward_host: "{{ hostvars['KVM-MONITOR01'].ansible_host }}"
    forward_port: 9090
  - name: npm
    forward_host: "{{ hostvars['KVM-VPN01'].ansible_host }}"
    forward_port: 81
  - name: adguardhome
    forward_host: "{{ hostvars['KVM-MGMT01'].ansible_host }}"
    forward_port: 3001
  - name: portainer
    forward_scheme: https
    forward_host: "{{ hostvars['KVM-MGMT01'].ansible_host }}"
    forward_port: 9443
  - name: homepage
    forward_host: "{{ hostvars['KVM-MGMT01'].ansible_host }}"
    forward_port: 3000
  - name: homeassistant
    forward_host: "{{ hostvars['KVM-MGMT01'].ansible_host }}"
    forward_port: 8123
  - name: motion
    forward_host: "{{ hostvars['KVM-SECURITY01'].ansible_host }}"
    forward_port: 8765
  - name: immich
    forward_host: "{{ hostvars['KVM-MEDIA01'].ansible_host }}"
    forward_port: 2283
  - name: jellyfin
    forward_host: "{{ hostvars['KVM-MEDIA01'].ansible_host }}"
    forward_port: 8096
  - name: itinder
    forward_host: "{{ hostvars['KVM-WEB01'].ansible_host }}"
    forward_port: 80
