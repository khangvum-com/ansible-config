#       "https://dns.cloudflare-dns.com/dns-query",
#       "1.1.1.1"
#     ]
#   }' \
#   http://localhost:3001/control/dns_config
- name: AdGuard Home Upstream DNS Configuration
  ansible.builtin.uri:
    url: "http://{{ hostvars['KVM-MGMT01'].ansible_host }}:3001/control/dns_config"
    method: POST
    user: "{{ ansible_user }}"
    password: "{{ ansible_password }}"
    force_basic_auth: yes
    body_format: json
    body:
      upstream_dns:
        - "[/{{ domain_name }}/]{{ hostvars['KVM-DC01'].ansible_host }}"
        - "https://dns.cloudflare-dns.com/dns-query"
        - "1.1.1.1"
    status_code: 200
  delegate_to: localhost