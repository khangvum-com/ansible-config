---
- name: Window Server IIS (Internet Information Services) Installation
  ansible.windows.win_feature:
    name: Web-Server
    include_sub_features: yes
    include_management_tools: yes
    state: present
  register: win_server_iis_installation
  when: "'webs' in group_names"

# Unnecessary for IIS
# - name: Reboot to Apply IIS Installation
#   ansible.windows.win_reboot:
#   when: win_server_iis_installation.reboot_required

- name: Default Web Site Stop
  microsoft.iis.website:
    name: Default Web Site
    state: stopped

# info3181casestudy.khangvum.com
- name: info3181casestudy Application Pool Creation
  microsoft.iis.web_app_pool:
    name: info3181casestudy
    state: started

- name: INFO-3181 Casestudy Creation
  microsoft.iis.website:
    name: INFO-3181 Casestudy
    state: started
    bindings:
      set:
        - ip: '*'
          port: 80
          hostname: info3181casestudy.khangvum.com
    physical_path: C:\inetpub\wwwroot\info3181casestudy.khangvum.com
    application_pool: info3181casestudy

# itinder.khangvum.com
- name: itinder Application Pool Creation
  microsoft.iis.web_app_pool:
    name: itinder
    state: started

- name: itinder Creation
  microsoft.iis.website:
    name: itinder
    state: started
    bindings:
      set:
        - ip: '*'
          port: 80
          hostname: itinder.khangvum.com
    physical_path: C:\inetpub\wwwroot\itinder.khangvum.com
    application_pool: itinder