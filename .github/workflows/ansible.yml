name: Ansible Pipeline

on:
  workflow_dispatch:
    inputs:
      global_configuration:
        type: boolean
        description: 'Global Configuration'
        default: false
      hyper_v_host_configuration:
        type: boolean
        description: 'Hyper-V Host Configuration'
        default: false
      vm_deployment:
        type: boolean
        description: 'VM Deployment'
        default: false
      windows_vm_configuration:
        type: boolean
        description: 'Windows VM Configuration'
        default: false
      linux_vm_configuration:
        type: boolean
        description: 'Linux VM Configuration'
        default: false
      domain_configuration:
        type: boolean
        description: 'Domain Configuration'
        default: false
      iis_configuration:
        type: boolean
        description: 'IIS Configuration'
        default: false
      container_deployment:
        type: boolean
        description: 'Container Deployment'
        default: false
  schedule:
    # Runs daily at 02:00 UTC
    # - 10:00 PM EDT
    # - 7:00 PM PDT
    # - 4:00 AM Hungary
    # - 9:00 AM Vietnam
    # - 12:00 PM Melbourne
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible.yml'

jobs:
  ansible:
    name: Execute Ansible Playbooks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ansible
    env:
      ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Connect to Tailscale and accept subnet routes
      # OAuth scope: api_access_tokens, auth_keys, devices:core, devices:routes:read, oauth_keys
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          version: latest
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Setup Python
        uses: actions/setup-python@v7

      - name: Install Ansible and Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible pyvmomi

      - name: Install Ansible Collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Create Vault Password File
        run: echo "$ANSIBLE_VAULT_PASSWORD" > .vault_pass

      - name: Parse Selected Tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS=""

            # Append selected tags
            [ "${{ inputs.global_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}global_configuration"
            [ "${{ inputs.hyper_v_host_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}hyper-v_host_configuration"
            [ "${{ inputs.vm_deployment }}" = "true" ] && TAGS="${TAGS:+$TAGS,}vm_deployment"
            [ "${{ inputs.windows_vm_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}windows_vm_configuration"
            [ "${{ inputs.linux_vm_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}linux_vm_configuration"
            [ "${{ inputs.domain_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}domain_configuration"
            [ "${{ inputs.iis_configuration }}" = "true" ] && TAGS="${TAGS:+$TAGS,}iis_configuration"
            [ "${{ inputs.container_deployment }}" = "true" ] && TAGS="${TAGS:+$TAGS,}container_deployment"

            # If any tag was selected, prepend host_connection_test
            if [ -n "$TAGS" ]; then
              TAGS="host_connection_test,$TAGS"
              echo "TAG_ARGS=--tags $TAGS" >> $GITHUB_ENV
            else
              # No checkboxes checked -> run all tasks without tags
              echo "TAG_ARGS=" >> $GITHUB_ENV
            fi
          else
            # For pushes, schedule runs, and pull requests -> run all tasks
            echo "TAG_ARGS=" >> $GITHUB_ENV
          fi

      - name: Ansible Syntax Check
        run: ansible-playbook site.yml $TAG_ARGS --syntax-check --vault-password-file .vault_pass

      - name: Execute Ansible Playbook
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        run: ansible-playbook site.yml $TAG_ARGS --vault-password-file .vault_pass

      - name: Clean up Vault Password File
        if: always()
        run: rm -f .vault_pass